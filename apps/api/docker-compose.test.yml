services:
  # PostgreSQL Database for E2E Tests
  postgres-test:
    image: postgres:17-alpine
    container_name: nexus-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_test
      POSTGRES_USER: nexus_test
      POSTGRES_PASSWORD: nexus_test_password
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - nexus-test-network

  # Redis Cache Service for E2E Tests
  redis-test:
    image: redis:8-alpine
    container_name: nexus-redis-test
    restart: unless-stopped
    ports:
      - '6380:6379'
    networks:
      - nexus-test-network

volumes:
  postgres_test_data:

networks:
  nexus-test-network:
    driver: bridge
